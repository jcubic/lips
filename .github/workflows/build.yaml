name: Build and test

on:
  push:
    paths:
      - "templates/Makefile"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - "scripts/*"
      - "tests/*"
      - "bin/*"
      - "lib/*"
      - "src/*"
      - "benchmarks/**"
      - ".github/workflows/build.yaml"
    branches:
      - master
      - devel
  pull_request:
    paths:
      - "templates/Makefile"
      - "Makefile"
      - "scripts/*"
      - "tests/*"
      - "bin/*"
      - "lib/*"
      - "src/*"
      - "benchmarks/**"
      - ".github/workflows/build.yaml"
    branches:
      - master
      - devel

jobs:
  build:
    runs-on: ubuntu-latest
    # A push to devel/master and a same-repo PR (e.g. devel->master) fire for the
    # same commit and would run twice. The push run already covers internal
    # branches, so skip the pull_request run unless it comes from a fork (which
    # produces no push event). This dedupes without cancelling anything.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Update deps
        run: sudo apt-get update
      - name: Install ImageMagick
        run: sudo apt-get -y install graphicsmagick
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: make
      - run: make lint
      # fast bootstrap + core-eval sanity check (lexical and dynamic scope)
      # before the full suite; also guards against a dynamic-mode boot hang
      - run: make smoke
      - run: make test
      - run: make coverage
      # upload this suite's coverage to Coveralls as one part of a parallel
      # build; the `coverage` job finalises it once the R7RS run is uploaded too
      - name: Coveralls (main suite)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          flag-name: main
          parallel: true

  r7rs:
    runs-on: ubuntu-latest
    # runs in parallel with `build`; the R7RS spec suite lives in the
    # underscore-prefixed tests/_r7rs-tests.scm so `make test` skips it and it
    # only runs here.
    # same dedupe as `build`: run on push, and on PRs only from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: run R7RS spec tests
        run: make test-r7rs
      # test-r7rs runs under c8, so turn the collected coverage into lcov and
      # publish it for the `coverage` job to merge with the main run
      - name: coverage report
        run: make coverage
      - name: Coveralls (R7RS suite)
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage/lcov.info
          flag-name: r7rs
          parallel: true

  coverage:
    runs-on: ubuntu-latest
    # tell Coveralls that every parallel coverage upload (main + r7rs) is done so
    # it merges them into a single report
    needs: [build, r7rs]
    # same dedupe as `build`: run on push, and on PRs only from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Coveralls finished
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
          carryforward: "main,r7rs"

  benchmark:
    runs-on: ubuntu-latest
    # same dedupe as `build`: run on push, and on PRs only from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: build
        run: make
      - name: run benchmark
        shell: bash
        run: |
          set -o pipefail
          node bin/lips.js benchmarks/suite.scm | tee benchmark_output.txt
      - name: validate benchmark output
        run: grep -q "ops/sec" benchmark_output.txt
      - name: clean uncommited files
        run: git reset --hard
      - name: store / compare benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        continue-on-error: true
        with:
          name: LIPS interpreter benchmark
          tool: benchmarkjs
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: data
          auto-push: ${{ github.event_name != 'pull_request' }}
          summary-always: true
          comment-always: true
          alert-threshold: '150%'
          fail-on-alert: false
          comment-on-alert: true
