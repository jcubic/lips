name: Build and test

on:
  push:
    paths:
      - "templates/Makefile"
      - "package.json"
      - "package-lock.json"
      - "Makefile"
      - "scripts/*"
      - "tests/*"
      - "bin/*"
      - "lib/*"
      - "src/*"
      - "benchmarks/**"
      - ".github/workflows/build.yaml"
    branches:
      - master
      - devel
  pull_request:
    paths:
      - "templates/Makefile"
      - "Makefile"
      - "scripts/*"
      - "tests/*"
      - "bin/*"
      - "lib/*"
      - "src/*"
      - "benchmarks/**"
      - ".github/workflows/build.yaml"
    branches:
      - master
      - devel

concurrency:
  # a push to devel while a devel->master PR is open triggers both a push and a
  # pull_request run for the same commit; key the group by the commit SHA so the
  # two collapse into one (the newer cancels the older) instead of running twice
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Update deps
        run: sudo apt-get update
      - name: Install ImageMagick
        run: sudo apt-get -y install graphicsmagick
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: make
      - run: make lint
      # fast bootstrap + core-eval sanity check (lexical and dynamic scope)
      # before the full suite; also guards against a dynamic-mode boot hang
      - run: make smoke
      - run: make test
      - run: make coverage
      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - name: build
        run: make
      - name: run benchmark
        shell: bash
        run: |
          set -o pipefail
          node bin/lips.js benchmarks/suite.scm | tee benchmark_output.txt
      - name: validate benchmark output
        run: grep -q "ops/sec" benchmark_output.txt
      - name: clean uncommited files
        run: git reset --hard
      - name: store / compare benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        continue-on-error: true
        with:
          name: LIPS interpreter benchmark
          tool: benchmarkjs
          output-file-path: benchmark_output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          benchmark-data-dir-path: data
          auto-push: ${{ github.event_name != 'pull_request' }}
          summary-always: true
          comment-always: true
          alert-threshold: '150%'
          fail-on-alert: false
          comment-on-alert: true
