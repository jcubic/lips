<!DOCTYPE HTML>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>Worker Example</title>
    <meta name="Description" content="Example of using LIPS in worker with RPC like API"/>
    <link rel="shortcut icon" href=""/>
    <script src="../dist/lips.js" bootstrap="../dist/std.xcb"></script>
    <script type="text/x-scheme">
     (define worker (new lips.Worker location.origin &(:meta true :track true)))
     (let ((response (worker.exec `(let ((message "hello"))
                                     (display "hello")
                                     (newline)
                                     message)  ;; `
                                     )))
         (display "worker"))
    </script>
    <script>
    // worker JavaScript example
    var worker = new lips.Worker("http://0.0.0.0:8000", { meta: true, track: true });
    (async function() {
         const code = `(let* ((what "hello")
                              (who "world")
                              (message (string-append what " " who)))
                         (display message)
                         (newline)
                         message)`;
         const [ result ] = await worker.rpc('eval', [code]);
         console.log({ result });
    })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <p>Open developer tools to see the console messages</p>
</body>
</html>
